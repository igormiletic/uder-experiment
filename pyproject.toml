[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uder-experiment"
version = "0.1.0"
description = "Experimental test framework for AI-assisted UDER/LDC/UCS invoice transformation evaluation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Igor Miletic" }]
requires-python = ">=3.11"
keywords = ["e-invoicing", "llm-evaluation", "ubl", "cii", "interoperability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "pydantic>=2.6",
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "jsonschema>=4.21",
    "openai>=1.30",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
uder-experiment = "uder_experiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
