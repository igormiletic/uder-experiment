[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uder-experiment"
version = "0.1.0"
description = "Experimental test framework for AI-assisted UDER/LDC/UCS invoice transformation evaluation"
requires-python = ">=3.11"

[project.scripts]
uder-experiment = "uder_experiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
